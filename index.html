<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Stock Count</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:720px;margin:auto;min-height:100vh;padding:16px 16px 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:28px;margin:0}.sub{color:#6b7280;font-size:14px;margin-top:3px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px}.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,input{font:inherit}.area-btn,.add-area{padding:17px 12px;border:1px solid #d1d5db;border-radius:14px;background:#fff;font-weight:700}.add-area{border-style:dashed;color:#374151}
.smallbtn{border:0;background:#e5e7eb;padding:9px 12px;border-radius:10px;font-weight:700}.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}.item-meta{color:#6b7280;font-size:14px;margin-bottom:5px}.item-name{font-size:27px;font-weight:800;margin-bottom:18px}
.field{border:3px solid #e5e7eb;border-radius:16px;padding:14px 16px;margin:10px 0;background:#f9fafb}.field.active{border-color:#111827;background:#fff}
.field-label{font-size:13px;font-weight:800;text-transform:uppercase;color:#6b7280}.field-value{font-size:40px;font-weight:800;line-height:1.05;margin-top:4px}
.next{width:100%;margin-top:12px;padding:17px;border:0;border-radius:14px;background:#111827;color:white;font-size:18px;font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.key{height:62px;border:0;border-radius:14px;background:#e5e7eb;font-size:23px;font-weight:800}.key.action{font-size:16px}
.summary-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e5e7eb}.summary-row:last-child{border-bottom:0}.summary-area{font-size:17px;font-weight:800;margin-top:18px}
.empty{color:#6b7280;text-align:center;padding:20px}.actions{display:flex;gap:8px}.actions button{flex:1}input[type=text]{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin:8px 0 12px}
.secondary{background:#e5e7eb;color:#111827}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Stock Count</h1><div class="sub">Offline stock counting</div></div><button class="smallbtn" onclick="showHome()">Areas</button></header>

<section id="home">
<div class="card"><h2>Select Area</h2><div class="area-grid" id="areaGrid"></div>
<button class="add-area" style="width:100%;margin-top:10px" onclick="addArea()">＋ Add Area</button></div>
<div class="card"><div class="topbar"><h2 style="margin:0">Current Count</h2><button class="smallbtn" onclick="showSummary()">View All</button></div><p class="sub">Your count saves automatically as you go.</p></div>
<div class="card"><h2>Saved Counts</h2><div id="savedCountsList"></div></div>
</section>

<section id="counter" class="hidden"><div class="card">
<div class="topbar"><div class="item-meta" id="progress"></div><button class="smallbtn" onclick="showHome()">Areas</button></div>
<div class="item-name" id="itemName"></div><div id="fields"></div>
<button class="next" onclick="submitValue()">Submit & Next</button>
<div class="keypad">
<button class="key" onclick="key('1')">1</button><button class="key" onclick="key('2')">2</button><button class="key" onclick="key('3')">3</button>
<button class="key" onclick="key('4')">4</button><button class="key" onclick="key('5')">5</button><button class="key" onclick="key('6')">6</button>
<button class="key" onclick="key('7')">7</button><button class="key" onclick="key('8')">8</button><button class="key" onclick="key('9')">9</button>
<button class="key action" onclick="clearValue()">Clear</button><button class="key" onclick="key('0')">0</button><button class="key action" onclick="backspace()">⌫</button>
</div></div></section>

<section id="summary" class="hidden"><div class="card">
<div class="topbar"><h2>Complete Count</h2><button class="smallbtn" onclick="showHome()">Areas</button></div>
<div id="summaryList"></div><button class="next secondary" onclick="startFreshCount()">Start New Count</button>
</div></section>

<section id="modal" class="hidden"><div class="card"><h2>Add Area</h2><p class="sub">Give the new area a name.</p>
<input id="newAreaName" type="text" placeholder="e.g. Back Bar"><div class="actions">
<button class="smallbtn" onclick="showHome()">Cancel</button><button class="next" style="margin:0" onclick="saveArea()">Add Area</button>
</div></div></section>
</div>

<script>
const DEFAULT_AREAS=["Store Room","Walk-in Chiller","Drinks Fridge","Freezer"];
const DEFAULT_ITEMS={
"Store Room":[["Flour 20kg",1,0],["Sugar 5kg",1,1],["Cooking Oil",1,0]],
"Walk-in Chiller":[["Semi-skimmed Milk",1,1],["Double Cream",1,0],["Butter",1,1],["Cheddar Cheese",0,1]],
"Drinks Fridge":[["Coca-Cola 330ml",1,1],["Diet Coke 330ml",1,1],["Orange Juice",1,1]],
"Freezer":[["Frozen Chips",1,0],["Ice Cream",1,1],["Frozen Peas",1,0]]
};
let areas=JSON.parse(localStorage.getItem("sc_areas")||"null")||DEFAULT_AREAS.slice();
let items=JSON.parse(localStorage.getItem("sc_items")||"null")||JSON.parse(JSON.stringify(DEFAULT_ITEMS));
let counts=JSON.parse(localStorage.getItem("sc_counts")||"{}");
let savedCounts=JSON.parse(localStorage.getItem("sc_saved")||"[]");
let currentArea="",currentIndex=0,activeType="",working={};

function save(){localStorage.setItem("sc_areas",JSON.stringify(areas));localStorage.setItem("sc_items",JSON.stringify(items));localStorage.setItem("sc_counts",JSON.stringify(counts));localStorage.setItem("sc_saved",JSON.stringify(savedCounts))}
function show(id){["home","counter","summary","modal"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function showHome(){show("home");renderAreas();renderSavedCounts()}
function renderAreas(){let g=document.getElementById("areaGrid");g.innerHTML="";areas.forEach(a=>{let b=document.createElement("button");b.className="area-btn";b.textContent=a;b.onclick=()=>startArea(a);g.appendChild(b)})}
function addArea(){document.getElementById("newAreaName").value="";show("modal");setTimeout(()=>document.getElementById("newAreaName").focus(),50)}
function saveArea(){let n=document.getElementById("newAreaName").value.trim();if(!n)return;if(areas.some(a=>a.toLowerCase()===n.toLowerCase())){alert("That area already exists.");return}areas.push(n);items[n]=[];save();showHome()}
function startArea(a){currentArea=a;currentIndex=0;if(!items[a]||!items[a].length){alert("No items have been added to this area yet.");return}loadItem()}
function loadItem(){
let it=items[currentArea][currentIndex];if(!it){showSummary();return}
document.getElementById("progress").textContent=currentArea+" • Item "+(currentIndex+1)+" of "+items[currentArea].length;
document.getElementById("itemName").textContent=it[0];
working={cases:counts[currentArea]?.[it[0]]?.cases??0,loose:counts[currentArea]?.[it[0]]?.loose??0};
let f=document.getElementById("fields");f.innerHTML="";
if(it[1])addField("cases","Cases");if(it[2])addField("loose","Loose");
activeType=it[1]?"cases":"loose";updateActive();show("counter")
}
function addField(t,l){let d=document.createElement("div");d.className="field";d.id="field-"+t;d.innerHTML='<div class="field-label">'+l+'</div><div class="field-value" id="value-'+t+'">'+working[t]+'</div>';d.onclick=()=>{activeType=t;updateActive()};document.getElementById("fields").appendChild(d)}
function updateActive(){["cases","loose"].forEach(t=>{let e=document.getElementById("field-"+t);if(e)e.classList.toggle("active",t===activeType)})}
function key(k){let v=String(working[activeType]??0);if(v==="0")v="";if(v.length<4)v+=k;working[activeType]=Number(v||0);document.getElementById("value-"+activeType).textContent=working[activeType]}
function clearValue(){working[activeType]=0;document.getElementById("value-"+activeType).textContent="0"}
function backspace(){let v=String(working[activeType]??0);v=v.length>1?v.slice(0,-1):"0";working[activeType]=Number(v);document.getElementById("value-"+activeType).textContent=v}
function submitValue(){
let it=items[currentArea][currentIndex];if(!counts[currentArea])counts[currentArea]={};counts[currentArea][it[0]]={};
if(it[1])counts[currentArea][it[0]].cases=working.cases;if(it[2])counts[currentArea][it[0]].loose=working.loose;save();
if(it[1]&&it[2]&&activeType==="cases"){activeType="loose";updateActive();return}currentIndex++;loadItem()
}

function renderSavedCounts(){
 const box=document.getElementById("savedCountsList");
 if(!savedCounts.length){box.innerHTML='<div class="empty">No saved counts yet.</div>';return}
 box.innerHTML="";
 savedCounts.forEach((s,i)=>{
   const d=document.createElement("div");
   d.className="summary-row";
   d.innerHTML='<span><strong>'+esc(s.date)+'</strong><br><small>'+esc(s.label)+'</small></span><button class="smallbtn" onclick="viewSavedCount('+i+')">View</button>';
   box.appendChild(d);
 });
}
function saveCurrentCountToHistory(){
 const hasCounts=Object.keys(counts).some(a=>Object.keys(counts[a]||{}).length);
 if(!hasCounts)return false;
 const now=new Date();
 const label=now.toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
 savedCounts.unshift({
   date:label,
   label:"Stock Count",
   areas:JSON.parse(JSON.stringify(areas)),
   items:JSON.parse(JSON.stringify(items)),
   counts:JSON.parse(JSON.stringify(counts))
 });
 if(savedCounts.length>30)savedCounts=savedCounts.slice(0,30);
 return true;
}
function viewSavedCount(i){
 const s=savedCounts[i];
 const box=document.getElementById("summaryList");
 box.innerHTML='<div class="notice"><strong>Saved Count:</strong> '+esc(s.date)+'</div>';
 let any=false;
 s.areas.forEach(a=>{
   let rows=[];
   (s.items[a]||[]).forEach(it=>{
     let c=s.counts[a]?.[it[0]];
     if(!c)return;
     any=true;
     let p=[];
     if(it[1])p.push("Cases: "+(c.cases??0));
     if(it[2])p.push("Loose: "+(c.loose??0));
     rows.push('<div class="summary-row"><span>'+esc(it[0])+'</span><strong>'+p.join(" · ")+"</strong></div>");
   });
   if(rows.length)box.innerHTML+='<div class="summary-area">'+esc(a)+"</div>"+rows.join("");
 });
 if(!any)box.innerHTML+='<div class="empty">No quantities were recorded in this saved count.</div>';
 document.getElementById("summary").querySelector(".topbar h2").textContent="Saved Count";
 document.querySelector("#summary .next").textContent="Back to Current Count";
 document.querySelector("#summary .next").onclick=showHome;
 show("summary");
}
function showSummary(){
let box=document.getElementById("summaryList");box.innerHTML="";let any=false;
areas.forEach(a=>{let rows=[];(items[a]||[]).forEach(it=>{let c=counts[a]?.[it[0]];if(!c)return;any=true;let p=[];if(it[1])p.push("Cases: "+(c.cases??0));if(it[2])p.push("Loose: "+(c.loose??0));rows.push('<div class="summary-row"><span>'+esc(it[0])+'</span><strong>'+p.join(" · ")+"</strong></div>")});
if(rows.length)box.innerHTML+='<div class="summary-area">'+esc(a)+"</div>"+rows.join("")});
if(!any)box.innerHTML='<div class="empty">Nothing has been counted yet.</div>';show("summary")
}
function startFreshCount(){
 if(!confirm("Start a new count? Your current count will be saved in Saved Counts, then the quantities will be cleared."))return;
 saveCurrentCountToHistory();
 counts={};
 save();
 showHome();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]))}
renderAreas();renderSavedCounts();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body></html>
